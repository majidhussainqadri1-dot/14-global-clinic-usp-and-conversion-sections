name: File 14 Ninth Review Corrective Apply
on:
  push:
    branches: [file14-seventh-10-round-corrective-review]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned
        with:
          ref: file14-seventh-10-round-corrective-review
          fetch-depth: 0
      - name: Apply ninth-review source corrections
        run: python3 scripts/apply-file14-ninth-review-corrections.py
      - name: Lint corrected plugin PHP
        run: find 14-global-clinic-usp-integration -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Commit corrected source if needed
        run: |
          if git diff --quiet; then
            echo "No corrective source changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 14-global-clinic-usp-integration
          git commit -m "File 14 v1.4.7: apply ninth ten-round corrective source fixes"
          git push origin HEAD:file14-seventh-10-round-corrective-review

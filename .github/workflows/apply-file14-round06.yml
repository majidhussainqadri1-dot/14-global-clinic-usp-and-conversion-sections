name: Apply File 14 Round 06 correction
on:
  push:
    branches: [file14-seventh-10-round-corrective-review]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: file14-seventh-10-round-corrective-review
          fetch-depth: 0
      - name: Apply Round 06 ledger fixes only after completed review
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('14-global-clinic-usp-integration/includes/class-gcu-repository.php')
          s=p.read_text()
          old="$r=$wpdb->get_results($wpdb->prepare($sql,$a),ARRAY_A);if(!is_array($r)){return array();}$all_claims=array();"
          new="$wpdb->last_error='';$r=$wpdb->get_results($wpdb->prepare($sql,$a),ARRAY_A);if(''!==(string)$wpdb->last_error||!is_array($r)){GCU_Observability::log('error','active_blocks_read_failed',array('slot'=>$slot,'locale'=>$locale));return array();}$all_claims=array();"
          if old not in s: raise SystemExit('active_blocks target not found')
          s=s.replace(old,new,1)
          old2="$rows=$wpdb->get_results($wpdb->prepare($sql,$keys),ARRAY_A);$out=array();foreach(is_array($rows)?$rows:array()as$row){"
          new2="$wpdb->last_error='';$rows=$wpdb->get_results($wpdb->prepare($sql,$keys),ARRAY_A);if(''!==(string)$wpdb->last_error||!is_array($rows)){GCU_Observability::log('error','public_claims_read_failed',array('claim_count'=>count($keys)));return array();}$out=array();foreach($rows as$row){"
          if old2 not in s: raise SystemExit('public_claims target not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)

          c=Path('tests/contract-tests.php')
          cs=c.read_text()
          if "Version: 1.4.7" not in cs or "Stable tag: 1.4.7" not in cs: raise SystemExit('contract version targets not found')
          cs=cs.replace("Version: 1.4.7","Version: 1.4.8").replace("GCU_VERSION', '1.4.7","GCU_VERSION', '1.4.8").replace('Version 1.4.7 drift.','Version 1.4.8 drift.').replace('Stable tag: 1.4.7','Stable tag: 1.4.8')
          c.write_text(cs)

          trace=Path('docs/REQUIREMENTS-TRACEABILITY.md')
          ts=trace.read_text()
          ts=ts.replace('# File 14 — Fresh Central + File Plan + Future CTI Requirements Traceability — v1.4.7','# File 14 — Requirements Traceability — v1.4.8',1)
          ts=ts.replace('2026-08-10 governing plans plus the 2026-08-11 ninth ten-round corrective cycle','2026-08-10 governing plans plus the current 2026-08-13 twenty-round corrective cycle',1)
          ts=ts.replace('The v1.4.6 eighth-cycle trace remains historical evidence. The v1.4.7 delta adds','The v1.4.7 starting trace remains historical evidence. The v1.4.8 delta retains and extends',1)
          ts=ts.replace('File 14 v1.4.7 may only claim a status supported by current exact-head evidence. Ninth-cycle repository corrections do not alter that rule.','File 14 v1.4.8 may only claim a status supported by current exact-head evidence. Current-cycle repository corrections do not alter that rule.',1)
          if 'Requirements Traceability — v1.4.8' not in ts or 'File 14 v1.4.8 may only claim a status' not in ts: raise SystemExit('traceability v1.4.8 normalization failed')
          trace.write_text(ts)

          rel=Path('docs/RELEASE-EVIDENCE.md')
          rs=rel.read_text()
          needle='Historical green results are supporting history only. '
          addition='The exact current PR-head SHA must be recorded and independently validated before any Automated-QA Green claim. '
          if addition not in rs:
              if needle not in rs: raise SystemExit('release evidence policy target missing')
              rs=rs.replace(needle,needle+addition,1)
          if 'exact current PR-head SHA' not in rs or 'After merge' not in rs: raise SystemExit('release evidence exact-head language missing')
          rel.write_text(rs)

          r=Path('scripts/review80.py')
          rr=r.read_text()
          replacements={
              '("14 central-plan regression follows current version", current_version and current_version in central_tests and f"Stable tag: {current_version}" in central_tests),': '("14 central-plan regression follows current version", bool(current_version) and "version_compare($version,\'1.4.8\',\'>=\')" in central_tests and "Stable tag: \'.$version" in central_tests),',
              '("76 PHP 7.4 exact-head workflow target retained", "php: [\'7.4\',\'8.3\']" in workflow and f"Version: {current_version}" in fresh1),': '("76 PHP 7.4 exact-head workflow target retained", "php: [\'7.4\',\'8.3\']" in workflow and "version_compare($argv[1],\\\"1.4.8\\\",\\\">=\\\")" in fresh1 and "Stable tag: $version" in fresh1),',
              '("77 PHP 8.3 exact-head workflow target retained", "php: [\'7.4\',\'8.3\']" in workflow and f"Stable tag: {current_version}" in fresh2),': '("77 PHP 8.3 exact-head workflow target retained", "php: [\'7.4\',\'8.3\']" in workflow and "Stable tag: $version" in fresh2),',
          }
          for old_gate,new_gate in replacements.items():
              if old_gate not in rr: raise SystemExit('review80 version-dynamic gate target missing: '+old_gate[:30])
              rr=rr.replace(old_gate,new_gate,1)
          r.write_text(rr)

          q=Path('scripts/quality.sh')
          qs=q.read_text()
          marker='php "$ROOT/tests/tenth-review-regression-tests.php"\n'
          if marker not in qs: raise SystemExit('quality marker not found')
          qs=qs.replace(marker,marker+'php "$ROOT/tests/eleventh-review-regression-tests.php"\n',1)
          q.write_text(qs)
          PY
          echo '' | base64 -d > tests/eleventh-review-regression-tests.php
          php -l 14-global-clinic-usp-integration/includes/class-gcu-repository.php
          php -l tests/contract-tests.php
          php -l tests/eleventh-review-regression-tests.php
          python3 -m py_compile scripts/review80.py
          rm -rf scripts/__pycache__
          php tests/eleventh-review-regression-tests.php
          bash scripts/quality.sh
          rm -f .github/workflows/apply-file14-round06.yml
      - name: Commit clean Round 06 corrected state
        shell: bash
        run: |
          set -euo pipefail
          BASE=e7536ee5fbf8754b6d6ca275300a3bd8f1033d28
          git reset "$BASE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'File 14 v1.4.8: round 06 public-read DB observability and regression alignment'
          git push --force-with-lease origin HEAD:refs/heads/file14-seventh-10-round-corrective-review

name: File 14 Review12 Round18 Apply
on:
  push:
    branches:
      - review/file14-twelfth-20-round-2026-08-29
    paths:
      - scripts/apply-review12-round18-security.py
      - .github/workflows/file14-review12-round18-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file14-twelfth-20-round-2026-08-29
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: python3 scripts/apply-review12-round18-security.py
      - run: php tests/twelfth-cycle-round18-regression-tests.php
      - run: bash scripts/quality.sh
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 14-global-clinic-usp-integration/includes/class-gcu-contracts.php 14-global-clinic-usp-integration/uninstall.php tests/twelfth-cycle-round18-regression-tests.php scripts/quality.sh
          git diff --cached --check
          git commit -m "review12 round-18: harden contract version and purge evidence"
          git push origin HEAD:review/file14-twelfth-20-round-2026-08-29

name: File 14 Fourth Review Corrective Patch
on:
  push:
    branches: ['review/file14-fourth-80-round-2026-08-10']
    paths:
      - 'scripts/apply-file14-fourth-review-corrections.py'
      - '.github/workflows/file14-fourth-review-corrective-patch.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: review/file14-fourth-80-round-2026-08-10
      - name: Apply fourth-review corrections
        run: python3 scripts/apply-file14-fourth-review-corrections.py
      - name: Lint corrected PHP
        run: find 14-global-clinic-usp-integration -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Commit corrected source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 14-global-clinic-usp-integration
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
          else
            git commit -m 'Apply File 14 fourth-review source corrections'
            git push
          fi

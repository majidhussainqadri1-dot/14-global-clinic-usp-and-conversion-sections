name: File 14 Review12 Round17 Review80 Sync
on:
  push:
    branches:
      - review/file14-twelfth-20-round-2026-08-29
    paths:
      - scripts/apply-review12-round17-review80-sync.py
      - .github/workflows/file14-review12-round17-review80-sync.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file14-twelfth-20-round-2026-08-29
          fetch-depth: 0
      - run: python3 scripts/apply-review12-round17-review80-sync.py
      - run: python3 scripts/review80.py
      - name: Commit sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/review80.py
          git diff --cached --check
          git commit -m "review12 round-17: synchronize review80 schema expectation"
          git push origin HEAD:review/file14-twelfth-20-round-2026-08-29

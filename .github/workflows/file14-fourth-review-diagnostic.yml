name: File 14 Fourth Review Diagnostic
on:
  push:
    branches: ['review/file14-fourth-80-round-2026-08-10']
    paths:
      - '.github/workflows/file14-fourth-review-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: review/file14-fourth-80-round-2026-08-10
      - name: Locate stale 1.4.1 current-state references
        run: |
          grep -R -n --exclude='REVIEW-80-LEDGER-v1.4.1.md' --exclude='REVIEW-80-SECOND-LEDGER-v1.4.1.md' --exclude='REVIEW-80-THIRD-LEDGER-v1.4.1.md' '1\.4\.1' tests scripts STATUS.md docs 14-global-clinic-usp-integration/readme.txt .github/workflows/file14-quality.yml || true
      - name: Run existing quality suite for diagnostic truth
        run: bash scripts/quality.sh

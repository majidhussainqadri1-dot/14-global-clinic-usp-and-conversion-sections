name: File 14 Third Review Second Harness Alignment

on:
  push:
    branches:
      - review/file14-third-80-round-2026-08-10

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: review/file14-third-80-round-2026-08-10
          fetch-depth: 0
      - name: Align inherited second-review assertions to stronger third-review semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/review80-second.py')
          s=p.read_text(encoding='utf-8')
          replacements={
            'ensure = section(future, "public static function ensure_schema()", "public static function runtime_ready()")':'ensure = section(future, "public static function ensure_schema( $force_verify = false )", "public static function runtime_ready()")',
            '("05 release evidence uses current repository-release framing", "Repository Release Evidence" in release and "exact current review/main SHA" in release),':'("05 release evidence uses current repository-release framing", "Repository Release Evidence" in release and "exact review/main SHA being accepted" in release and "fresh post-merge" in release),',
            '("13 public destinations endpoint uses safe DTO and obeys module safe mode", "public_destination_health()" in rest and "public function destinations(){if(!get_option(\'gcu_enabled\',1))" in rest),':'("13 public destinations endpoint uses safe DTO and obeys runtime fail-close", "public_destination_health()" in rest and "public function destinations(){$ready=GCU_Install::ready_for_runtime();" in rest),',
            '("20 activation and routine upgrade explicitly ensure Future schema", "activate(){$r=self::install_or_upgrade(true)" in install and "self::ensure_future_schema();" in install and "private static function ensure_future_schema()" in install),':'("20 activation and controlled repair explicitly ensure Future schema", "activate(){$r=self::install_or_upgrade(true)" in install and "self::ensure_future_schema(true);" in install and "private static function ensure_future_schema($force_verify=false)" in install),',
            '("21 Future schema fast path avoids SHOW TABLE queries when current and healthy", "&& ! get_option( self::SAFE_MODE_OPTION, 0 )" in ensure and re.search(r"if \\( self::SCHEMA_VERSION === .*?\\) \\{\\s*return true;", ensure, re.S) is not None),':'("21 Future schema fast path avoids SHOW TABLE queries when current and healthy", "if ( ! $force_verify && self::SCHEMA_VERSION ===" in ensure and "&& ! get_option( self::SAFE_MODE_OPTION, 0 ) ) {\\n\\t\\t\\treturn true;" in ensure),',
            '("55 public Future response may retain explicit public cache policy", "public, max-age=60" in future and "public_response" in future),':'("55 public Future response retains explicit public revalidation policy", "public, no-cache, max-age=0, must-revalidate" in future and "public_response" in future),',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('Expected inherited second-review assertion missing: '+old[:120])
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile scripts/review80-second.py
      - name: Commit inherited harness alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/review80-second.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align inherited second-review gate with third-review semantics"
          git push origin HEAD:review/file14-third-80-round-2026-08-10

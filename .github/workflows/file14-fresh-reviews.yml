name: File 14 Fresh Post-Code Reviews
on:
  push:
    branches: [main, 'complete/**', 'review/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  round-1:
    name: Fresh Review Round 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - run: bash scripts/fresh-review-round-1.sh
  round-2:
    name: Fresh Review Round 2
    runs-on: ubuntu-latest
    needs: round-1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - run: bash scripts/fresh-review-round-2.sh

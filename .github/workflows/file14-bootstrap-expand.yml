name: Expand File 14 completion bundle

on:
  push:
    branches:
      - complete/file-14-plan-v1.0.0

permissions:
  contents: write

jobs:
  expand-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct and extract reviewed source
        shell: bash
        run: |
          set -euo pipefail
          test -d .file14-bootstrap
          cat .file14-bootstrap/bundle.part-* | tr -d '\r\n' | base64 --decode > /tmp/file14-completion.tar.gz
          tar -tzf /tmp/file14-completion.tar.gz >/dev/null
          tar -xzf /tmp/file14-completion.tar.gz -C .
          test -f 14-global-clinic-usp-integration/global-clinic-usp-integration.php
          rm -f .github/workflows/file14-quality.yml CHECKSUMS.sha256
          find 14-global-clinic-usp-integration docs scripts tests -type f -print0 | sort -z | xargs -0 sha256sum > CHECKSUMS.sha256
          sha256sum MANIFEST.md STATUS.md >> CHECKSUMS.sha256
          chmod +x scripts/quality.sh scripts/build.sh

      - name: Run complete repository quality gates
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/quality.sh
          bash scripts/build.sh
          sha256sum -c dist/14-global-clinic-usp-integration-1.0.0.zip.sha256

      - name: Publish source-only completion commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 14-global-clinic-usp-integration docs scripts tests STATUS.md MANIFEST.md CHECKSUMS.sha256
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No source changes were produced.'
            exit 1
          fi
          git commit -m 'Complete File 14 plan implementation v1.0.0'
          git push origin HEAD:complete/file-14-plan-v1.0.0

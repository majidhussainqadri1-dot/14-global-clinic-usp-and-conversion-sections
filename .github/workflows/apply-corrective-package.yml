name: Apply Corrective Package

on:
  push:
    branches:
      - fix/file-14-corrective-audit
    paths:
      - corrective-package/**
      - .github/workflows/apply-corrective-package.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-corrective-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@v4
        with:
          ref: fix/file-14-corrective-audit
          fetch-depth: 0

      - name: Verify and extract corrective package
        shell: bash
        run: |
          set -euo pipefail
          archive='corrective-package/file14-corrective-0.1.1.zip'
          echo 'ea376532c66133fe5ca3245eeeacb9703fc8c0199d4d252d1b7145653de4f9b9  corrective-package/file14-corrective-0.1.1.zip' | sha256sum --check -
          unzip -oq "$archive" -d .

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate corrected source
        shell: bash
        run: |
          set -euo pipefail
          find global-clinic-usp tests -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
          php tests/contract-tests.php
          sha256sum --check CHECKSUMS.sha256
          echo '3ec6e447498e8a5b0833068b7b31afd0b52a67a5eae6e1cd9605e5c28ba710b5  source-package/14-global-clinic-usp-and-conversion-sections-0.1.0.zip' | sha256sum --check -

      - name: Commit corrective candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add global-clinic-usp tests .github/workflows CHECKSUMS.sha256 BASELINE-CHECKSUMS.sha256 CORRECTIVE-REVIEW.md CORRECTIVE-PROVENANCE.md STATUS.md MANIFEST.md corrective-package/file14-corrective-0.1.1.zip
          if git diff --cached --quiet; then
            echo 'Corrective package is already applied.'
            exit 0
          fi
          git commit -m 'Correct File 14 audit defects'
          git push origin HEAD:fix/file-14-corrective-audit

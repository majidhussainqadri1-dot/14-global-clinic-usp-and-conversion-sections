# retry-10
name: File 14 Sixth Review Finalizer

on:
  push:
    branches:
      - review/file14-sixth-80-round-2026-08-11
    paths:
      - .github/workflows/file14-sixth-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
      - name: Configure committer
        run: |
          git config user.name "File 14 Review Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Normalize transformer indentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/finalize-sixth-review.py')
          s=p.read_text(encoding='utf-8').replace("r'''\\t", "'''\\t")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply final corrective patch
        run: python3 scripts/finalize-sixth-review.py
      - name: Align v1.4.4 evidence and inherited review assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements={
            'docs/REQUIREMENTS-TRACEABILITY.md':[('v1.4.3','v1.4.4'),('fifth-review corrections','sixth-review corrections')],
            'STATUS.md':[('v1.4.3 Fifth-Review Repository Candidate','v1.4.4 Sixth-Review Repository Candidate'),('Software candidate: `1.4.3`','Software candidate: `1.4.4`'),('Base File 14 database schema: `10004`','Base File 14 database schema: `10005`'),('14-global-clinic-usp-integration-1.4.3.zip','14-global-clinic-usp-integration-1.4.4.zip'),('This fifth-review branch','This sixth-review branch')],
            'docs/RELEASE-EVIDENCE.md':[('v1.4.3 Fifth-Review Repository Candidate','v1.4.4 Sixth-Review Repository Candidate'),('Software candidate: `1.4.3`','Software candidate: `1.4.4`'),('Base schema: `10004`','Base schema: `10005`')],
          }
          for name,pairs in replacements.items():
              p=Path(name); s=p.read_text(encoding='utf-8')
              for a,b in pairs:s=s.replace(a,b)
              p.write_text(s,encoding='utf-8')
          p=Path('tests/second-review-regression-tests.php');s=p.read_text(encoding='utf-8').replace('v1.4.4 Fifth-Review Repository Candidate','v1.4.4 Sixth-Review Repository Candidate');p.write_text(s,encoding='utf-8')
          p=Path('tests/third-review-regression-tests.php');s=p.read_text(encoding='utf-8');old="tr_check(false!==strpos($repo,'audit_lock_failed')&&false!==strpos($repo,'audit_write_failed')&&substr_count($repo,\"update_option('gcu_enabled',0,false)\")>=4,'Audit/outbox persistence failures are not fail-closed contained.');";new="tr_check(false!==strpos($repo,\"mark_containment('audit_lock_failed')\")&&false!==strpos($repo,\"mark_containment('audit_write_failed')\")&&false!==strpos($repo,\"mark_containment('outbox_write_failed')\")&&false!==strpos($repo,'private function apply_containment()'),'Audit/outbox persistence failures are not fail-closed contained.');";s=s.replace(old,new);p.write_text(s,encoding='utf-8')
          p=Path('scripts/review80.py');s=p.read_text(encoding='utf-8').replace('18 base schema remains 10004 and separate from patch version','18 base schema remains 10005 and separate from patch version').replace("\"GCU_SCHEMA_VERSION', 10004\" in loader","\"GCU_SCHEMA_VERSION', 10005\" in loader").replace('"START TRANSACTION" in install and "START TRANSACTION" in future','"START TRANSACTION" in install and "begin_owned_transaction" in repo and "commit_owned_transaction" in repo');p.write_text(s,encoding='utf-8')
          p=Path('scripts/review80-second.py');s=p.read_text(encoding='utf-8').replace("GCU_SCHEMA_VERSION', 10004","GCU_SCHEMA_VERSION', 10005");p.write_text(s,encoding='utf-8')
          p=Path('scripts/review80-third.py');s=p.read_text(encoding='utf-8').replace("GCU_SCHEMA_VERSION', 10004","GCU_SCHEMA_VERSION', 10005");s=s.replace("'outbox_payload_invalid' in repo and 'outbox_write_failed' in repo and repo.count(\"update_option('gcu_enabled',0,false)\")>=4","\"mark_containment('outbox_payload_invalid')\" in repo and \"mark_containment('outbox_write_failed')\" in repo and 'private function apply_containment()' in repo");p.write_text(s,encoding='utf-8')
          p=Path('scripts/review80-fourth.py');s=p.read_text(encoding='utf-8').replace("'audit_write_failed' in repo and \"update_option('gcu_enabled',0,false)\" in repo","\"mark_containment('audit_write_failed')\" in repo and 'private function apply_containment()' in repo");p.write_text(s,encoding='utf-8')
          p=Path('scripts/review80-fifth.py');s=p.read_text(encoding='utf-8').replace('v1.4.3','v1.4.4').replace('"START TRANSACTION" in fifth and "COMMIT" in fifth','"begin_owned_transaction()" in fifth and "commit_owned_transaction()" in fifth').replace('"ROLLBACK" in fifth','"rollback_owned_transaction()" in fifth').replace('The five repository review ledgers are:','The six repository review ledgers are:');p.write_text(s,encoding='utf-8')
          p=Path('scripts/fresh-review-round-1.sh');s=p.read_text(encoding='utf-8').replace('Version: 1.4.3','Version: 1.4.4').replace("GCU_SCHEMA_VERSION', 10004","GCU_SCHEMA_VERSION', 10005").replace('need "START TRANSACTION" "$P/includes/class-gcu-fifth-review-hardening.php"','need "begin_owned_transaction()" "$P/includes/class-gcu-fifth-review-hardening.php"');p.write_text(s,encoding='utf-8')
          p=Path('scripts/fresh-review-round-2.sh');s=p.read_text(encoding='utf-8').replace('Stable tag: 1.4.3','Stable tag: 1.4.4');p.write_text(s,encoding='utf-8')
          PY
          git add docs/REQUIREMENTS-TRACEABILITY.md STATUS.md docs/RELEASE-EVIDENCE.md tests/second-review-regression-tests.php tests/third-review-regression-tests.php scripts/review80.py scripts/review80-second.py scripts/review80-third.py scripts/review80-fourth.py scripts/review80-fifth.py scripts/fresh-review-round-1.sh scripts/fresh-review-round-2.sh
          git commit -m "QA: forward-align inherited review gates for v1.4.4"
      - name: Run full quality gate
        run: bash scripts/quality.sh
      - name: Remove one-shot finalizer
        run: |
          rm -f scripts/finalize-sixth-review.py .github/workflows/file14-sixth-finalize.yml
          git add -A
          git commit -m "Remove temporary sixth-review finalizer"
      - name: Push final corrected tree
        run: git push origin HEAD:${GITHUB_REF_NAME}

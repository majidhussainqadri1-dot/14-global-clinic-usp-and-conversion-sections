name: File 14 Quality and Package

on:
  push:
    branches: [main, 'complete/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP ${{ matrix.php }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 pinned commit
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: bash scripts/quality.sh

  package:
    name: Reproducible package
    runs-on: ubuntu-latest
    needs: php-quality
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: bash scripts/build.sh
      - run: sha256sum -c dist/14-global-clinic-usp-integration-1.3.0.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: file-14-v1.3.0
          path: |
            dist/14-global-clinic-usp-integration-1.3.0.zip
            dist/14-global-clinic-usp-integration-1.3.0.zip.sha256
          if-no-files-found: error

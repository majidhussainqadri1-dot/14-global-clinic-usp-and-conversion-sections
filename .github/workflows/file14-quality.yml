name: File 14 Quality and Package
on:
  push:
    branches: [main, 'complete/**', 'review/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-quality:
    name: PHP ${{ matrix.php }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4','8.3']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 pinned
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: bash scripts/quality.sh
  package:
    name: Deterministic package and SBOM
    runs-on: ubuntu-latest
    needs: php-quality
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - run: bash scripts/build.sh
      - name: Verify exact-version package, checksum and SBOM
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re, zipfile
          root = pathlib.Path('.')
          main = (root/'14-global-clinic-usp-integration/global-clinic-usp-integration.php').read_text(encoding='utf-8')
          hm = re.search(r'^\s*\*\s*Version:\s*([0-9]+(?:\.[0-9]+){2})\s*$', main, re.M)
          cm = re.search(r"define\(\s*'GCU_VERSION'\s*,\s*'([^']+)'\s*\)", main)
          assert hm and cm and hm.group(1) == cm.group(1), 'Plugin header/GCU_VERSION drift'
          version = hm.group(1)
          base = root/'dist'/f'14-global-clinic-usp-integration-{version}'
          zip_path = pathlib.Path(str(base)+'.zip')
          sha_path = pathlib.Path(str(base)+'.zip.sha256')
          sbom_path = pathlib.Path(str(base)+'.sbom.json')
          assert zip_path.is_file() and sha_path.is_file() and sbom_path.is_file(), 'Exact-version release files missing'
          expected = sha_path.read_text(encoding='utf-8').split()[0]
          actual = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          assert expected == actual, 'ZIP SHA-256 mismatch'
          sbom = json.loads(sbom_path.read_text(encoding='utf-8'))
          assert sbom['version'] == version
          assert sbom['package_sha256'] == actual
          assert sbom['file_count'] == len(sbom['files']) and sbom['file_count'] > 0
          with zipfile.ZipFile(zip_path) as z:
              assert z.testzip() is None
              assert all(n.startswith('14-global-clinic-usp-integration/') and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist())
          print(f'Package/SBOM verification: PASS — v{version} — {actual}')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: file-14-package-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/*
          if-no-files-found: error

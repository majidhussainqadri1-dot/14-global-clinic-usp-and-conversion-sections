name: File 14 Review12 Round02 Apply
on:
  push:
    branches:
      - review/file14-twelfth-20-round-2026-08-29
    paths:
      - scripts/apply-review12-round02-auth.py
      - .github/workflows/file14-review12-round02-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file14-twelfth-20-round-2026-08-29
          fetch-depth: 0
      - name: Apply Round 02 correction
        run: python3 scripts/apply-review12-round02-auth.py
      - name: Syntax check
        run: php -l 14-global-clinic-usp-integration/includes/class-gcu-future-intelligence.php
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 14-global-clinic-usp-integration/includes/class-gcu-future-intelligence.php
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 1
          fi
          git commit -m "review12 round-02: bind Future mutations to exact authorization objects"
          git push origin HEAD:review/file14-twelfth-20-round-2026-08-29

name: File 14 Second Review Corrective Patch

on:
  push:
    branches:
      - review/file14-second-80-round-2026-08-10
    paths:
      - scripts/apply-file14-second-review-corrections.py

permissions:
  contents: write

jobs:
  apply-corrections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned
        with:
          ref: ${{ github.sha }}
      - name: Apply exact corrective replacements
        run: python3 scripts/apply-file14-second-review-corrections.py
      - name: Validate PHP syntax after correction
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 pinned
        with:
          php-version: '8.3'
          coverage: none
      - run: find 14-global-clinic-usp-integration -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Commit corrective source state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No corrective diff to commit.'
            exit 0
          fi
          git commit -m 'Apply File 14 second 80-pass corrective fixes'
          git push origin HEAD:review/file14-second-80-round-2026-08-10

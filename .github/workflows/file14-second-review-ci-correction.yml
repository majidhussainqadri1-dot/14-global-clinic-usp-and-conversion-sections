name: File 14 Second Review CI Correction

on:
  push:
    branches:
      - review/file14-second-80-pr-2026-08-10
    paths:
      - scripts/apply-file14-second-review-ci-correction.py

permissions:
  contents: write

jobs:
  correct-ci-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - run: python3 scripts/apply-file14-second-review-ci-correction.py
      - name: Commit exact correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/review80.py docs/REVIEW-80-SECOND-LEDGER-v1.4.1.md
          git diff --cached --quiet && exit 0
          git commit -m 'Align first Review80 gate with current File 14 status truth'
          git push origin HEAD:review/file14-second-80-pr-2026-08-10

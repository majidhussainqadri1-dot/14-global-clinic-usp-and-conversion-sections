name: File 14 Sixth Review Corrective Runner

on:
  push:
    branches:
      - review/file14-sixth-80-round-2026-08-11
    paths:
      - .github/workflows/file14-sixth-review-corrections.yml

permissions:
  contents: write

jobs:
  apply-corrections:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
      - name: Configure review committer
        run: |
          git config user.name "File 14 Review Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Apply ordered corrective commits
        run: python3 scripts/apply-sixth-review-corrections.py
      - name: Verify final tree before push
        run: bash scripts/quality.sh
      - name: Push corrected review history
        run: git push origin HEAD:${GITHUB_REF_NAME}

name: File 14 Round 20 Root Correction
on:
  push:
    branches: [file14-eleventh-20-round-corrective-review-2026-08-13]
    paths: [.github/workflows/file14-round20-root-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - run: python3 scripts/apply-file14-round20-root-min.py
      - run: php -l 14-global-clinic-usp-integration/includes/class-gcu-future-intelligence.php
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 14-global-clinic-usp-integration/includes/class-gcu-future-intelligence.php
          git diff --cached --quiet && exit 0
          git commit -m "review11 round-20: fix Future report root methods"
          git push

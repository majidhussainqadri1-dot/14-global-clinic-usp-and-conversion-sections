name: Corrective Quality

on:
  push:
    branches:
      - fix/**
  pull_request:

permissions:
  contents: read

jobs:
  php-and-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP
        run: find global-clinic-usp tests -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Run corrective contract tests
        run: php tests/contract-tests.php

      - name: Verify current source checksums
        run: |
          find global-clinic-usp -type f -print0 | sort -z | xargs -0 sha256sum
          sha256sum --check CHECKSUMS.sha256

      - name: Verify original source provenance
        run: |
          set -euo pipefail
          echo '3ec6e447498e8a5b0833068b7b31afd0b52a67a5eae6e1cd9605e5c28ba710b5  source-package/14-global-clinic-usp-and-conversion-sections-0.1.0.zip' | sha256sum --check -
          rm -rf /tmp/file14-baseline
          mkdir -p /tmp/file14-baseline
          unzip -q source-package/14-global-clinic-usp-and-conversion-sections-0.1.0.zip -d /tmp/file14-baseline
          (cd /tmp/file14-baseline && sha256sum --check "$GITHUB_WORKSPACE/BASELINE-CHECKSUMS.sha256")

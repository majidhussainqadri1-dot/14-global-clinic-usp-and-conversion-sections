name: File 14 Review12 Round04 Apply
on:
  push:
    branches:
      - review/file14-twelfth-20-round-2026-08-29
    paths:
      - scripts/apply-review12-round04-inputs.py
      - .github/workflows/file14-review12-round04-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file14-twelfth-20-round-2026-08-29
          fetch-depth: 0
      - name: Apply Round 04 corrections
        run: python3 scripts/apply-review12-round04-inputs.py
      - name: Syntax and dedicated regression
        run: |
          php -l 14-global-clinic-usp-integration/includes/class-gcu-future-intelligence.php
          php tests/twelfth-cycle-round04-regression-tests.php
      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 14-global-clinic-usp-integration/includes/class-gcu-future-intelligence.php tests/twelfth-cycle-round04-regression-tests.php scripts/quality.sh
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 1
          fi
          git commit -m "review12 round-04: harden public report input and storage abuse"
          git push origin HEAD:review/file14-twelfth-20-round-2026-08-29

name: File 14 Fourth Review Finalize
on:
  push:
    branches: ['review/file14-fourth-80-round-2026-08-10']
    paths:
      - 'scripts/finalize-file14-fourth-review.py'
      - '.github/workflows/file14-fourth-review-finalize.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: review/file14-fourth-80-round-2026-08-10
      - name: Correct generated PHP literal assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/finalize-file14-fourth-review.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          repl={
            'Founder active-placement approval missing.': "f4c(false!==strpos($repo,'APPROVE_CLAIMS')&&false!==strpos($repo,\"'placement'\")&&false!==strpos($repo,\"'active'\"),'Founder active-placement approval missing.');",
            'Per-stage small-cohort suppression missing.': "f4c(false!==strpos($repo,'suppressed_stages')&&false!==strpos($repo,'$safe[]=$row'),'Per-stage small-cohort suppression missing.');",
            'CTA source-event correlation missing.': "f4c(false!==strpos($repo,'source_event_id'),'CTA source-event correlation missing.');",
            'Recent audit tail verification missing.': "f4c(false!==strpos($repo,'recent_tail')&&false!==strpos($repo,'OFFSET %d'),'Recent audit tail verification missing.');",
            'Shortcode cache freshness missing.': "f4c(false!==strpos($front,'has_shortcode')&&false!==strpos($front,'gcu_block')&&false!==strpos($front,'nocache_headers()'),'Shortcode cache freshness missing.');",
            'Rollback can destructively delete post-snapshot data.': "f4c(false===strpos($install,'DELETE FROM `$table`')&&false!==strpos($install,'captured_at')&&false!==strpos($install,'$wpdb->replace'),'Rollback can destructively delete post-snapshot data.');",
            'Expanded health evidence missing.': "f4c(false!==strpos($obs,'schema_verified')&&false!==strpos($obs,'dependencies')&&false!==strpos($obs,'cron')&&false!==strpos($obs,'routes'),'Expanded health evidence missing.');",
            'Partial audit coverage does not warn.': "f4c(false!==strpos($obs,'audit_chain')&&false!==strpos($obs,\"'full'!==\"),'Partial audit coverage does not warn.');",
          }
          out=[]
          for line in lines:
              changed=False
              for marker,new in repl.items():
                  if marker in line:
                      out.append(new); changed=True; break
              if not changed: out.append(line)
          p.write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Finalize fourth-review gates and release truth
        run: python3 scripts/finalize-file14-fourth-review.py
      - name: Lint all PHP after finalization
        run: find 14-global-clinic-usp-integration tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Commit durable fourth-review state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize File 14 fourth independent 80-pass review'
          git push

name: File 14 Review12 Round17 Apply
on:
  push:
    branches:
      - review/file14-twelfth-20-round-2026-08-29
    paths:
      - scripts/apply-review12-round17-performance.py
      - .github/workflows/file14-review12-round17-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file14-twelfth-20-round-2026-08-29
          fetch-depth: 0
      - name: Apply Round 17 correction
        run: python3 scripts/apply-review12-round17-performance.py
      - name: Syntax and regression
        run: |
          php -l 14-global-clinic-usp-integration/global-clinic-usp-integration.php
          php -l 14-global-clinic-usp-integration/includes/class-gcu-install.php
          php -l 14-global-clinic-usp-integration/includes/class-gcu-eleventh-review-hardening.php
          php tests/twelfth-cycle-round17-regression-tests.php
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 14-global-clinic-usp-integration/global-clinic-usp-integration.php 14-global-clinic-usp-integration/includes/class-gcu-install.php 14-global-clinic-usp-integration/includes/class-gcu-eleventh-review-hardening.php tests/twelfth-cycle-round17-regression-tests.php scripts/quality.sh
          git diff --cached --check
          git commit -m "review12 round-17: index retention cleanup paths"
          git push origin HEAD:review/file14-twelfth-20-round-2026-08-29

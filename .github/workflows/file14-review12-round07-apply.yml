name: File 14 Review12 Round07 Apply
on:
  push:
    branches:
      - review/file14-twelfth-20-round-2026-08-29
    paths:
      - scripts/apply-review12-round07-destination.py
      - .github/workflows/file14-review12-round07-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file14-twelfth-20-round-2026-08-29
          fetch-depth: 0
      - name: Apply Round 07 correction
        run: python3 scripts/apply-review12-round07-destination.py
      - name: Syntax and regression
        run: |
          php -l 14-global-clinic-usp-integration/includes/class-gcu-repository.php
          php tests/twelfth-cycle-round07-regression-tests.php
      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 14-global-clinic-usp-integration/includes/class-gcu-repository.php tests/twelfth-cycle-round07-regression-tests.php scripts/quality.sh
          git diff --cached --check
          git commit -m "review12 round-07: enforce destination readiness on placement activation"
          git push origin HEAD:review/file14-twelfth-20-round-2026-08-29

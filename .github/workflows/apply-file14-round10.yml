name: Apply File 14 Round 10 correction
on:
  push:
    branches: [file14-seventh-10-round-corrective-review]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: file14-seventh-10-round-corrective-review
          fetch-depth: 0
      - name: Apply Round 10 public-read DB fail-close correction after completed review
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('14-global-clinic-usp-integration/includes/class-gcu-repository.php')
          s=p.read_text()
          old="$r=$wpdb->get_results($wpdb->prepare($sql,$a),ARRAY_A);if(!is_array($r)){return array();}$all_claims=array();"
          new="$wpdb->last_error='';$r=$wpdb->get_results($wpdb->prepare($sql,$a),ARRAY_A);if(''!==(string)$wpdb->last_error||!is_array($r)){GCU_Observability::log('error','active_blocks_read_failed',array('slot'=>$slot,'locale'=>$locale));return array();}$all_claims=array();"
          if old not in s: raise SystemExit('active_blocks target not found')
          s=s.replace(old,new,1)
          old="$rows=$wpdb->get_results($wpdb->prepare($sql,$keys),ARRAY_A);$out=array();foreach(is_array($rows)?$rows:array()as$row){"
          new="$wpdb->last_error='';$rows=$wpdb->get_results($wpdb->prepare($sql,$keys),ARRAY_A);if(''!==(string)$wpdb->last_error||!is_array($rows)){GCU_Observability::log('error','public_claims_read_failed',array('claim_count'=>count($keys)));return array();}$out=array();foreach($rows as$row){"
          if old not in s: raise SystemExit('public_claims target not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          q=Path('scripts/quality.sh')
          qs=q.read_text()
          marker='php "$ROOT/tests/tenth-review-regression-tests.php"\n'
          if marker not in qs: raise SystemExit('quality marker missing')
          if 'eleventh-review-regression-tests.php' not in qs:
              qs=qs.replace(marker,marker+'php "$ROOT/tests/eleventh-review-regression-tests.php"\n',1)
          q.write_text(qs)
          PY
          cat > tests/eleventh-review-regression-tests.php <<'PHP'
          <?php
          $root=dirname(__DIR__);$repo=file_get_contents($root.'/14-global-clinic-usp-integration/includes/class-gcu-repository.php');$fail=array();
          function r10ck($c,$m){global$fail;if(!$c){$fail[]=$m;}}
          r10ck(substr_count($repo,"$wpdb->last_error='';")>=2,'Public repository reads must clear DB last_error.');
          r10ck(false!==strpos($repo,'active_blocks_read_failed'),'active_blocks DB failure observability missing.');
          r10ck(false!==strpos($repo,'public_claims_read_failed'),'public_claims DB failure observability missing.');
          r10ck(false!==strpos($repo,"''!==(string)$wpdb->last_error||!is_array($r)"),'active_blocks DB failure check missing.');
          r10ck(false!==strpos($repo,"''!==(string)$wpdb->last_error||!is_array($rows)"),'public_claims DB failure check missing.');
          if($fail){fwrite(STDERR,"Eleventh review regression tests failed:\n- ".implode("\n- ",$fail)."\n");exit(1);}echo "Eleventh review regression tests: PASS\n";
          PHP
          php -l 14-global-clinic-usp-integration/includes/class-gcu-repository.php
          php -l tests/eleventh-review-regression-tests.php
          php tests/eleventh-review-regression-tests.php
          rm -f .github/workflows/apply-file14-round10.yml
      - name: Commit Round 10 corrected state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(round-10): fail closed and observe public DB read failures'
          git push origin HEAD:file14-seventh-10-round-corrective-review

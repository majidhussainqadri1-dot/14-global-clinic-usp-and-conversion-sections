name: File 14 Review12 Round12 Apply
on:
  push:
    branches:
      - review/file14-twelfth-20-round-2026-08-29
    paths:
      - scripts/apply-review12-round12-experiment.py
      - .github/workflows/file14-review12-round12-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file14-twelfth-20-round-2026-08-29
          fetch-depth: 0
      - run: python3 scripts/apply-review12-round12-experiment.py
      - run: |
          php -l 14-global-clinic-usp-integration/includes/class-gcu-future-policy.php
          php -l 14-global-clinic-usp-integration/includes/class-gcu-fifth-review-hardening.php
          php tests/twelfth-cycle-round12-regression-tests.php
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 14-global-clinic-usp-integration/includes/class-gcu-future-policy.php 14-global-clinic-usp-integration/includes/class-gcu-fifth-review-hardening.php tests/twelfth-cycle-round12-regression-tests.php scripts/quality.sh
          git diff --cached --check
          git commit -m "review12 round-12: harden experiment preflight and early-stop failure"
          git push origin HEAD:review/file14-twelfth-20-round-2026-08-29

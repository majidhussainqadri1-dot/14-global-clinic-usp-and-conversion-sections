name: File 14 Third Review Corrective Patch

on:
  push:
    branches:
      - review/file14-third-80-round-2026-08-10

permissions:
  contents: write

jobs:
  apply-corrections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: review/file14-third-80-round-2026-08-10
          fetch-depth: 0
      - name: Apply pending third-review final replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-file14-third-review-final-corrections.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("private static function public_response( $data, $status = 200 )", "private static function public_response( array $data, $status = 200 )")
          p.write_text(s,encoding='utf-8')
          PY
          python3 scripts/apply-file14-third-review-final-corrections.py
      - name: Validate PHP syntax after correction
        run: find 14-global-clinic-usp-integration -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Commit corrective source state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- 14-global-clinic-usp-integration; then
            echo "No corrective source diff remains."
            exit 0
          fi
          git add 14-global-clinic-usp-integration
          git commit -m "Apply final File 14 third-review corrections"
          git push origin HEAD:review/file14-third-80-round-2026-08-10

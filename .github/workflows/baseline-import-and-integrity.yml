name: Baseline Import and Integrity

on:
  push:
    branches:
      - baseline/file-14-original-import
  pull_request:

permissions:
  contents: read

jobs:
  verify-baseline-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify original archive
        run: echo '3ec6e447498e8a5b0833068b7b31afd0b52a67a5eae6e1cd9605e5c28ba710b5  source-package/14-global-clinic-usp-and-conversion-sections-0.1.0.zip' | sha256sum --check -
      - name: Verify immutable baseline file checksums
        run: |
          rm -rf /tmp/file14-baseline
          mkdir -p /tmp/file14-baseline
          unzip -q source-package/14-global-clinic-usp-and-conversion-sections-0.1.0.zip -d /tmp/file14-baseline
          (cd /tmp/file14-baseline && sha256sum --check "$GITHUB_WORKSPACE/BASELINE-CHECKSUMS.sha256")

  lint-baseline-on-baseline-branch:
    if: github.event_name == 'push' && github.ref_name == 'baseline/file-14-original-import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 pinned commit
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify and lint original source package without mutating repository state
        run: |
          set -euo pipefail
          archive='source-package/14-global-clinic-usp-and-conversion-sections-0.1.0.zip'
          echo '3ec6e447498e8a5b0833068b7b31afd0b52a67a5eae6e1cd9605e5c28ba710b5  source-package/14-global-clinic-usp-and-conversion-sections-0.1.0.zip' | sha256sum --check -
          rm -rf /tmp/file14-baseline
          mkdir -p /tmp/file14-baseline
          unzip -q "$archive" -d /tmp/file14-baseline
          find /tmp/file14-baseline -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

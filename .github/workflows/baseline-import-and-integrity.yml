name: Baseline Import and Integrity

on:
  push:
    branches:
      - baseline/file-14-original-import
  pull_request:

permissions:
  contents: write

jobs:
  import-source:
    if: github.event_name == 'push' && github.ref_name == 'baseline/file-14-original-import' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout baseline branch
        uses: actions/checkout@v4
        with:
          ref: baseline/file-14-original-import
          fetch-depth: 0

      - name: Verify and extract original source package
        run: |
          set -euo pipefail
          archive='source-package/14-global-clinic-usp-and-conversion-sections-0.1.0.zip'
          test -f "$archive"
          echo '3ec6e447498e8a5b0833068b7b31afd0b52a67a5eae6e1cd9605e5c28ba710b5  source-package/14-global-clinic-usp-and-conversion-sections-0.1.0.zip' | sha256sum --check -
          rm -rf global-clinic-usp
          unzip -q "$archive"
          test -f global-clinic-usp/global-clinic-usp.php

      - name: Generate immutable baseline evidence
        run: find global-clinic-usp -type f -print0 | sort -z | xargs -0 sha256sum > CHECKSUMS.sha256

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint imported source
        run: find global-clinic-usp -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Commit extracted baseline when required
        env:
          TARGET_BRANCH: baseline/file-14-original-import
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add global-clinic-usp CHECKSUMS.sha256
          if git diff --cached --quiet; then
            echo 'Baseline source is already imported.'
            exit 0
          fi
          git commit -m 'Import original File 14 plugin source'
          git push origin HEAD:${TARGET_BRANCH}

  verify-baseline-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify original archive
        run: echo '3ec6e447498e8a5b0833068b7b31afd0b52a67a5eae6e1cd9605e5c28ba710b5  source-package/14-global-clinic-usp-and-conversion-sections-0.1.0.zip' | sha256sum --check -

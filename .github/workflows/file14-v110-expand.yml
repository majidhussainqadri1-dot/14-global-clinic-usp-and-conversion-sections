name: Expand File 14 v1.1.0 four-plan completion

on:
  push:
    branches:
      - complete/file-14-plan-v1.0.0

permissions:
  contents: write

jobs:
  expand-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct reviewed source
        shell: bash
        run: |
          set -euo pipefail
          test -d .file14-v110-bootstrap
          cat .file14-v110-bootstrap/bundle.part-* | tr -d '\r\n' | base64 --decode > /tmp/file14-v110.tar.gz
          echo "fdb9c469e3a551939f0f484257f888e68454fd1ed151ea96a862a9e05f92d92f  /tmp/file14-v110.tar.gz" | sha256sum -c -
          tar -tzf /tmp/file14-v110.tar.gz >/dev/null
          tar -xzf /tmp/file14-v110.tar.gz -C .
          chmod +x scripts/quality.sh scripts/build.sh

      - name: Four-plan quality and deterministic package
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/quality.sh
          sha256sum -c dist/14-global-clinic-usp-integration-1.1.0.zip.sha256

      - name: Publish v1.1.0 completion commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .file14-v110-bootstrap
          rm -f .github/workflows/file14-v110-expand.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No completion changes were produced.'
            exit 1
          fi
          git commit -m 'Complete File 14 four-plan review and remediation v1.1.0'
          git push origin HEAD:complete/file-14-plan-v1.0.0
